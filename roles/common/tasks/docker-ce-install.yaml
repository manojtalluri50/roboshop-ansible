- name: Download Repo file
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker.repo

- name: Install Docker
  ansible.builtin.dnf:
    name: docker-ce
    state: installed

- name: Install docker SDK
  become: true
  pip:
    name:
      - docker==6.1.3
      - requests
      - requests-unixsocket
    executable: pip3

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

